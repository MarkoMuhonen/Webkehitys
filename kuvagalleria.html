<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuvgalleria</title>
    <link rel="stylesheet" href="kuvagalleria.css">
</head>

<body>
    <header class="header">
        <a href="#" class="logo">Koirasivu</a>
        <nav class="nav">
            <ul>
                <li><a href="#">Etusivu</a></li>
                <li><a href="#">Tuotteet</a></li>
                <li><a href="#">Yhteystiedot</a></li>
            </ul>





        </nav>

    </header>
    <main class="container">
        <section class="intro">
            <h1>Koiragalleria</h1>
            <p>Tällä sivustolla on koirien kuvia</p>


        </section>
        <section class="gallery-section">
            <h2>Koirien kuva-albumi</h2>
            <div class="gallery">
                <figure class="gallery-item">
                    <img src="kuvat/koira1.jpg" alt="Koira 1">
                    <figcaption>Värikäs koira</figcaption>
                </figure>
                <figure class="gallery-item">
                    <img src="kuvat/koira2.jpg" alt="Koira 2">
                    <figcaption>Värikäs koira</figcaption>
                </figure>
                <figure class="gallery-item">
                    <img src="kuvat/koira3.jpg" alt="Koira 3">
                    <figcaption>Värikäs koira</figcaption>
                </figure>
                <figure class="gallery-item">
                    <img src="kuvat/koira4.jpg" alt="Koira 4">
                    <figcaption>Värikäs koira</figcaption>
                </figure>

            </div>
        </section>

        <!-- Kuvakaruselli -->
        <section class="carousel-section">
            <h2>Kuvakaruselli</h2>
            <p>Voit skrollata karusellia vaakasuunnassa</p>
            <div class="carousel">
                <figure class="carousel-item" id="slide1">
                    <img src="kuvat/koira1.jpg" alt="Koira 1">
                    <figcaption>Värikäs koira</figcaption>
                </figure>
                <figure class="carousel-item" id="slide2">
                    <img src="kuvat/koira2.jpg" alt="Koira 2">
                    <figcaption>Värikäs koira</figcaption>
                </figure>

                <figure class="carousel-item" id="slide3">
                    <img src="kuvat/koira3.jpg" alt="Koira 3">
                    <figcaption>Värikäs koira</figcaption>
                </figure>

                <figure class="carousel-item" id="slide4">
                    <img src="kuvat/koira4.jpg" alt="Koira 4">
                    <figcaption>Värikäs koira</figcaption>
                </figure>
            </div>
            <nav class="carousel-nav">
                <a href="#slide1">1</a>
                <a href="#slide2">2</a>
                <a href="#slide3">3</a>
                <a href="#slide4">4</a>
            </nav>

        </section>
</body>

</html>
